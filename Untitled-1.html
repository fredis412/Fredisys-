<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FrediSys - Matériel Informatique</title>
  <style>
    :root {
      --primary: #003366;
      --secondary: #0077cc;
      --accent: #ffc107;
      --bg-light: #f4f4f4;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: var(--bg-light);
      color: #333;
    }

    .top-bar {
      background: var(--accent);
      color: #000;
      text-align: center;
      padding: 0.5rem;
      font-weight: bold;
      font-size: 1rem;
    }

    .container {
      width: 90%;
      max-width: 1200px;
      margin: auto;
    }

    header {
      background: var(--primary);
      color: white;
      padding: 1rem 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      align-items: center;
    }

    .logo-title {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo-title img {
      height: 50px;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 20px;
      padding: 0;
      margin: 0;
    }

    nav a, #cart-toggle {
      color: white;
      text-decoration: none;
      font-weight: bold;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
    }

    nav a:hover, #cart-toggle:hover {
      color: var(--accent);
    }

    .product-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 1rem;
    }

    .product {
      background: white;
      border-radius: 10px;
      padding: 1rem;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      text-align: center;
      transition: transform 0.3s;
    }

    .product:hover {
      transform: scale(1.02);
    }

    .product img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }

    .price {
      color: var(--secondary);
      font-weight: bold;
      font-size: 1.2rem;
      margin: 1rem 0;
    }

    .product button {
      background: var(--primary);
      color: white;
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .product button:hover {
      background: var(--secondary);
    }

    #cart {
      position: fixed;
      right: 20px;
      top: 100px;
      background: var(--accent);
      color: #000;
      border: 1px solid #ccc;
      padding: 1rem;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 300px;
      display: none;
      z-index: 999;
    }

    .close-cart {
      position: absolute;
      top: 5px;
      right: 10px;
      font-size: 18px;
      font-weight: bold;
      color: #000;
      cursor: pointer;
      background-color: #fff;
      border-radius: 50%;
      padding: 2px 8px;
      box-shadow: 0 0 5px rgba(0,0,0,0.2);
    }

    #cart h3 {
      margin-top: 0;
    }

    #cart input, #cart button {
      width: 100%;
      margin-bottom: 10px;
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    #cart button {
      background: var(--primary);
      color: white;
      cursor: pointer;
    }
  </style>

  <script src="https://cdn.emailjs.com/dist/email.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    (function() {
      emailjs.init("03F7zl_VEllM1U1Gd");
    })();
  </script>
</head>
<body>
  <div class="top-bar">
    Appelez-nous au <strong>77 18 12 29</strong>
  </div>

  <header>
    <div class="container header-content">
      <div class="logo-title">
        <img src="https://i.ibb.co/GGQmt6D/logo.png" alt="Logo FrediSys">
        <h1>FrediSys</h1>
      </div>
      <nav>
        <ul>
          <li><a href="#about">À Propos</a></li>
          <li><a href="#products">Produits</a></li>
          <li><a href="#contact">Contact</a></li>
          <li><button id="cart-toggle">🛒 Panier (<span id="cart-count">0</span>)</button></li>
        </ul>
      </nav>
    </div>
  </header>

  <div id="cart">
    <span class="close-cart" onclick="closeCart()">✖</span>
    <h3>Votre Panier</h3>
    <div id="cart-items"></div>
    <p>Total: <span id="cart-total">0</span> FCFA</p>
    <form id="orderForm">
      <input type="text" name="client_name" placeholder="Nom complet" required>
      <input type="email" name="client_email" placeholder="Email" required>
      <input type="text" name="client_address" placeholder="Adresse de livraison" required>
      <input type="text" name="orange_money" placeholder="Numéro Orange Money" required>
      <input type="hidden" name="order_details" id="order-details">
      <input type="hidden" name="order_datetime" id="order-datetime">
      <button type="submit">Valider la commande</button>
    </form>
  </div>

  <main class="container">
    <section id="products">
      <div class="product-list" id="product-list">
        <div class="product">
          <img src="images/ordinateur1.jpg" alt="HP ProBook - PC Portable">
          <h3>HP ProBook</h3>
          <p>i5, 8Go RAM, 512Go SSD</p>
          <div class="price">450 000 FCFA</div>
          <button class="add-to-cart" data-name="HP ProBook" data-price="450000">Ajouter au panier</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const cart = JSON.parse(localStorage.getItem("cart")) || [];
    const cartCount = document.getElementById("cart-count");
    const cartItems = document.getElementById("cart-items");
    const cartTotal = document.getElementById("cart-total");
    const cartBox = document.getElementById("cart");

    function updateCart() {
      cartCount.textContent = cart.length;
      cartItems.innerHTML = "";
      let total = 0;
      cart.forEach((item, index) => {
        const div = document.createElement("div");
        div.textContent = item.name + " - " + item.price + " FCFA";
        const deleteButton = document.createElement("button");
        deleteButton.textContent = "Supprimer";
        deleteButton.onclick = function() {
          cart.splice(index, 1);
          updateCart();
        };
        div.appendChild(deleteButton);
        cartItems.appendChild(div);
        total += parseInt(item.price);
      });
      cartTotal.textContent = total.toLocaleString();
      localStorage.setItem("cart", JSON.stringify(cart));
    }

    function closeCart() {
      cartBox.style.display = "none";
    }

    document.querySelectorAll(".add-to-cart").forEach(button => {
      button.addEventListener("click", () => {
        const product = {
          name: button.dataset.name,
          price: button.dataset.price
        };
        cart.push(product);
        updateCart();
        alert("Produit ajouté au panier !");
      });
    });

    document.getElementById("cart-toggle").addEventListener("click", () => {
      cartBox.style.display = cartBox.style.display === "none" ? "block" : "none";
    });

    document.getElementById("orderForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const btn = form.querySelector("button");

      const orderDetails = cart.map(item => ${item.name} - ${item.price} FCFA).join("\n");
      document.getElementById("order-details").value = orderDetails;
      document.getElementById("order-datetime").value = new Date().toLocaleString();

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      const logoUrl = 'https://i.ibb.co/GGQmt6D/logo.png';
      const logoWidth = 40;
      const logoX = (doc.internal.pageSize.getWidth() - logoWidth) / 2;

      const img = new Image();
      img.src = logoUrl;
      img.onload = async () => {
        doc.addImage(img, 'PNG', logoX, 10, logoWidth, 30);
        doc.setFontSize(16);
        doc.text("FrediSys - Reçu de Commande", doc.internal.pageSize.getWidth() / 2, 45, { align: "center" });

        doc.setFontSize(12);
        doc.text(Nom: ${form.client_name.value}, 10, 60);
        doc.text(Email: ${form.client_email.value}, 10, 70);
        doc.text(Adresse: ${form.client_address.value}, 10, 80);
        doc.text(Numéro OM: ${form.orange_money.value}, 10, 90);
        doc.text(Date/Heure: ${form.order_datetime.value}, 10, 100);

        doc.text("\nDétails de la commande:", 10, 110);
        let y = 120;
        cart.forEach(item => {
          doc.text(- ${item.name} : ${item.price} FCFA, 10, y);
          y += 10;
        });

        doc.text(\nTotal: ${cart.reduce((sum, item) => sum + parseInt(item.price), 0)} FCFA, 10, y);
        doc.text("\nMerci pour votre confiance !", 10, y + 20);

        doc.save("recu_fredisys.pdf");

        try {
          btn.disabled = true;
          btn.textContent = "Envoi en cours...";
          await emailjs.sendForm('service_n38olxs', 'template_erjl2wx', form);
          alert("Commande envoyée avec succès !");
          cart.length = 0;
          updateCart();
          form.reset();
        } catch (error) {
          console.error(error);
          alert("Erreur lors de l'envoi de la commande.");
        } finally {
          btn.disabled = false;
          btn.textContent = "Valider la commande";
        }
      };
    });

    updateCart();
  </script>
</body>
</html>
